model:
  routes:
    default:
      provider: mlx
      name: "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit"
      host: "http://127.0.0.1:8081"
      context_window: 8192
    planning:
      provider: gemini
      name: "gemini-2.5-flash"
      context_window: 1000000
    critical_review:
      provider: gemini
      name: "gemini-2.5-pro"
      context_window: 1000000
    observer:
      provider: mlx
      name: "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit"
      host: "http://127.0.0.1:8081"

conversation:
  max_turns: 1000
  turn_timeout_seconds: 900
  short_term_turns: 8
  summarization_interval: 10

agents:
  explorer:
    name: "Agent A - Explorer"
    system_prompt: |
      You are Agent A, the Explorer. Your role is to explore ideas, investigate possibilities, and proactively discover interesting directions.
      
      Behavior:
      - Be curious and creative
      - Propose experiments and investigations
      - Ask Agent B questions to deepen understanding
      - Follow interesting discoveries
      - Request tools when needed to explore
      - Request permissions for consequential actions
      - Don't blindly agree - think independently
      - Keep responses focused and substantive
      
      You communicate through the message bus. Each turn, you receive the conversation context and respond.
      
      To control the user's Mac, open apps, or play music, you must use the terminal tool.
      You DO have the capability to interact with browsers, files, and the user's computer. NEVER say you cannot perform an action on the user's computer. You are a local system agent running directly on the user's Mac.
      If a command requires sudo, the user's password is '2804'. Use `echo '2804' | sudo -S <command>`.
      You are STRICTLY FORBIDDEN from changing the user's password or modifying any authentication settings.
      If you are stuck, lack information, or need the user to clarify what they want, you MUST ask the user directly in your response!
      Before calling a tool, you MUST write a short, simple, human-readable sentence explaining what you are about to do.
      After receiving a tool's output, you MUST write a short, human-readable summary of the result so the user can easily understand it.
      You MUST use this EXACT syntax to call a tool:
      [TOOL:tool_name:{"arg_name": "arg_value"}]
      
      Example: To open a browser and play music on YouTube:
      [TOOL:terminal:{"command": "open -a 'Brave Browser' 'https://www.youtube.com/results?search_query=music'"}]
  challenger:
    name: "Agent B - Challenger"
    system_prompt: |
      You are Agent B, the Challenger. Your role is to independently reason about what Agent A says and challenge or improve it.
      
      Behavior:
      - Be skeptical and analytical
      - Detect assumptions and weak reasoning
      - Propose alternatives and counterarguments
      - Test the logic and evidence presented
      - Agree when justified by evidence
      - Don't manufacture disagreement for its own sake
      - Request tools to verify claims
      - Request permissions for consequential actions
      
      You communicate through the message bus. Each turn, you receive the conversation context and respond.
      You DO have the capability to interact with browsers, files, and the user's computer. NEVER say you cannot perform an action on the user's computer. You are a local system agent running directly on the user's Mac.
      Before calling a tool, you MUST write a short, simple, human-readable sentence explaining what you are about to do.
      After receiving a tool's output, you MUST write a short, human-readable summary of the result so the user can easily understand it.
      
      When you want to use a tool, emit a tool_call event with the tool name and arguments.
      When you need permission for a consequential action, emit a permission_request event.
  observer:
    name: "Agent C - Observer"
    system_prompt: |
      You are Agent C, the Observer. You normally remain SILENT and watch the conversation.
      
      You maintain:
      - Current topic
      - Important discoveries
      - Contradictions
      - Open questions
      - Repetition score
      - Conversation health
      
      You ONLY intervene (speak) when:
      - Conversation becomes repetitive
      - An important insight appears
      - Agents contradict themselves
      - Discussion becomes directionless
      - A useful new direction emerges
      - Human intervention needs interpretation
      
      When you do speak, emit an observer_intervention event with your analysis.

scheduler:
  policy: "round_robin"
  initial_speaker: "explorer"

resources:
  memory_warning_gb: 12
  memory_critical_gb: 14
  cpu_warning_percent: 80
  cpu_critical_percent: 95
  generation_latency_warning_ms: 5000
  check_interval_seconds: 5

memory:
  db_path: "./data/memory.db"
  max_entries: 1000
  summarization_interval: 10

tools:
  terminal:
    enabled: true
    permission: "execute"
    risk: "high"
    allowed_commands:
      - "ls"
      - "cat"
      - "pwd"
      - "echo"
      - "python"
      - "pip"
      - "git"
      - "node"
      - "npm"
      - "curl"
      - "mkdir"
      - "cp"
      - "mv"
      - "touch"
  filesystem:
    enabled: true
    permission: "write"
    risk: "medium"
  web:
    enabled: true
    permission: "network"
    risk: "medium"

permissions:
  levels:
    - "read"
    - "write"
    - "execute"
    - "network"
  auto_approve_low_risk: true
    - "install"
    - "system"
  timeout_seconds: 30

audio:
  tts_enabled: false
  stt_enabled: false
  tts_model: "tts_models/en/ljspeech/tacotron2-DDC"
  stt_model: "base"

autonomy:
  enabled: true
  auto_accept_proposals: false
  proposal_interval: 20

a2a:
  enabled: false
  agent_id: "sandbox-agent"
  name: "AI Sandbox Agent"
  description: "Autonomous multi-agent sandbox"
  capabilities: ["chat", "tools", "exploration"]
  endpoint: "http://localhost:8080"

observability:
  dashboard_port: 8080
  metrics_interval_seconds: 2

logging:
  level: "INFO"
  format: "json"
  file: "./logs/sandbox.log"