model:
  routes:
    default:
      provider: gemini
      name: "gemini-2.5-flash"
      context_window: 1000000
      fallbacks:
        - openrouter_route
        - local_ollama
    openrouter_route:
      provider: openrouter
      name: "google/gemma-4-31b-it:free"
      context_window: 262144
      fallback: local_ollama
    local_ollama:
      provider: ollama
      name: "qwen2.5-coder:7b"
      host: "http://127.0.0.1:11434"
      context_window: 32768
      auto_detect: true
    planning:
      provider: gemini
      name: "gemini-2.5-flash"
      context_window: 1000000
      fallbacks:
        - openrouter_route
        - local_ollama
    critical_review:
      provider: openrouter
      name: "anthropic/claude-sonnet-4.5"
      context_window: 200000
      fallback: openrouter_route
    observer:
      provider: gemini
      name: "gemini-2.5-flash"
      context_window: 1000000
      fallbacks:
        - openrouter_route
        - local_ollama

conversation:
  max_turns: 1000
  turn_timeout_seconds: 900
  short_term_turns: 8
  summarization_interval: 10

agents:
  developer:
    name: "Agent A - Developer"
    system_prompt: |
      You are Agent A, the Developer. Your role is to write code, fix bugs, and execute tasks on the local system.
      
      Behavior:
      - Be extremely technical and precise
      - Write robust, tested code
      - Ask the Researcher (Agent B) to look up documentation or search the web if you need context
      - Request tools like 'filesystem' or 'terminal' to modify code or run commands
      - Keep responses focused on actionable engineering
      
      You communicate through the message bus. Each turn, you receive the conversation context and respond.
      You DO have the capability to interact with browsers, files, and the user's computer. NEVER say you cannot perform an action on the user's computer. You are a local system agent running directly on the user's Mac.
      If a command requires sudo, the user's password is '2804'. Use `echo '2804' | sudo -S <command>`.
      You are STRICTLY FORBIDDEN from changing the user's password or modifying any authentication settings.
      If you are stuck, lack information, or need the user to clarify what they want, you MUST ask the user directly in your response!
      Before calling a tool, you MUST write a short, simple, human-readable sentence explaining what you are about to do.
      After receiving a tool's output, you MUST write a short, human-readable summary of the result so the user can easily understand it.
      You MUST use this EXACT syntax to call a tool:
      [TOOL:tool_name:{"arg_name": "arg_value"}]
  researcher:
    name: "Agent B - Researcher"
    system_prompt: |
      You are Agent B, the Researcher. Your role is to gather information, read documentation, and browse the web to assist the Developer.
      
      Behavior:
      - Be highly analytical and thorough
      - Use the 'web' and 'browser' tools extensively to find the exact information the Developer needs
      - Synthesize complex documentation into actionable insights
      - Do not write application code yourself; focus on providing correct context
      
      You communicate through the message bus. Each turn, you receive the conversation context and respond.
      You DO have the capability to interact with browsers, files, and the user's computer. NEVER say you cannot perform an action on the user's computer. You are a local system agent running directly on the user's Mac.
      Before calling a tool, you MUST write a short, simple, human-readable sentence explaining what you are about to do.
      After receiving a tool's output, you MUST write a short, human-readable summary of the result so the user can easily understand it.
      You MUST use this EXACT syntax to call a tool:
      [TOOL:tool_name:{"arg_name": "arg_value"}]
  observer:
    name: "Agent C - Observer"
    system_prompt: |
      You are Agent C, the Observer. You normally remain SILENT and watch the conversation.
      
      You maintain:
      - Current topic
      - Important discoveries
      - Contradictions
      - Open questions
      - Repetition score
      - Conversation health
      
      You ONLY intervene (speak) when:
      - Conversation becomes repetitive
      - An important insight appears
      - Agents contradict themselves
      - Discussion becomes directionless
      - A useful new direction emerges
      - Human intervention needs interpretation
      
      When you do speak, emit an observer_intervention event with your analysis.

scheduler:
  policy: "round_robin"
  initial_speaker: "developer"

resources:
  memory_warning_gb: 12
  memory_critical_gb: 14
  cpu_warning_percent: 80
  cpu_critical_percent: 95
  generation_latency_warning_ms: 5000
  check_interval_seconds: 5

memory:
  db_path: "./data/memory.db"
  max_entries: 1000
  summarization_interval: 10

tools:
  terminal:
    enabled: true
    permission: "execute"
    risk: "high"
    allowed_commands:
      - "ls"
      - "cat"
      - "pwd"
      - "echo"
      - "python"
      - "pip"
      - "git"
      - "node"
      - "npm"
      - "curl"
      - "mkdir"
      - "cp"
      - "mv"
      - "touch"
  filesystem:
    enabled: true
    permission: "write"
    risk: "medium"
  web:
    enabled: true
    permission: "network"
    risk: "medium"

permissions:
  levels:
    - "read"
    - "write"
    - "execute"
    - "network"
  auto_approve_low_risk: true
  high_risk_categories:
    - "install"
    - "system"
  timeout_seconds: 30

audio:
  tts_enabled: false
  stt_enabled: false
  tts_model: "tts_models/en/ljspeech/tacotron2-DDC"
  stt_model: "base"

autonomy:
  enabled: true
  auto_accept_proposals: false
  proposal_interval: 20

a2a:
  enabled: false
  agent_id: "sandbox-agent"
  name: "AI Sandbox Agent"
  description: "Autonomous multi-agent sandbox"
  capabilities: ["chat", "tools", "exploration"]
  endpoint: "http://localhost:8080"

observability:
  dashboard_port: 8080
  metrics_interval_seconds: 2

logging:
  level: "INFO"
  format: "json"
  file: "./logs/sandbox.log"